name: Build Server Console Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\ServerConsole.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PowerShell syntax is valid."

      - name: Smoke test batch process, output streams, and command input
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ServerConsole.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Compress-Archive -Path INSTALL.bat,RUN-CONSOLE.bat,ServerConsole.ps1,RESTORE-ORIGINAL-RUN.bat,README.md -DestinationPath build\server-console-package.zip -Force
          if ((Get-Item build\server-console-package.zip).Length -lt 1000) {
            throw "The package ZIP is unexpectedly small."
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-console-package
          path: build/server-console-package.zip
          if-no-files-found: error

      - name: Publish latest GitHub Release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status
          if (-not (gh release view latest 2>$null)) {
            gh release create latest --title "Latest Server Dark Console" --notes "Portable Windows server console package. No Gradle or external runtime dependencies."
          }
          gh release upload latest build/server-console-package.zip --clobber
          gh release delete-asset latest server-dark-gui-1.0.0.jar --yes
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Old mod JAR was not present or could not be removed."
            $global:LASTEXITCODE = 0
          }
